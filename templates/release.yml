# Orbit release workflow template (profile `release_via: ci`, rule OPR-09). Copy to .github/workflows/release.yml
# only on the owner's go: a workflow is a security path. Fill the two TODO steps from the profile's full check and
# build. A pushed `vX.Y.Z` tag on a commit of the default branch builds, checksums, attests and publishes the release;
# the tag is never moved, so a failed run is fixed forward with a new PATCH tag.
name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+", "v[0-9]+.[0-9]+.[0-9]+-*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Project code and its dependencies run here, with a read-only token and no OIDC token.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TAG: ${{ github.ref_name }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: The tag is annotated and on the default branch (or a release/X.Y line)
        run: |
          test "$(git cat-file -t "refs/tags/$TAG")" = tag || { echo "::error::$TAG is a lightweight tag"; exit 1; }
          git branch -r --contains "$GITHUB_SHA" | grep -Eq "^ *origin/($DEFAULT_BRANCH|release/[0-9]+\.[0-9]+)$" \
            || { echo "::error::$TAG is not on $DEFAULT_BRANCH or a release line"; exit 1; }

      - name: Test
        run: echo "TODO the profile's full check" && exit 1

      - name: Build
        run: echo "TODO build the release files into dist/" && exit 1

      - name: Checksums
        run: cd dist && sha256sum -- * > SHA256SUMS

      - name: Release notes (the CHANGELOG section and the compare link)
        run: |
          v="${TAG#v}"
          awk -v v="$v" '$0 ~ "^## \\[?v?" v "([] ]|$)" {on=1; next} /^## / && on {exit} on' CHANGELOG.md > notes.md
          prev=$(git tag --list 'v*' --sort=-v:refname --merged "$GITHUB_SHA^" | grep -Ev -- '-' | head -n1 || true)
          if [ -n "$prev" ]; then printf '\n**Full changelog**: %s/compare/%s...%s\n' "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$prev" "$TAG" >> notes.md; fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release
          path: |
            dist/
            notes.md
          if-no-files-found: error

  # Only trusted steps run with write and OIDC permissions: no project code is executed here, and the build's
  # files are data (attested and attached, never run).
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write       # create the release
      id-token: write       # sign the provenance attestation
      attestations: write   # store it
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Release channel (from the tags, not from the build job)
        run: |
          highest=$(git tag --list 'v*' --sort=-v:refname | grep -Ev -- '-' | head -n1)
          case "$TAG" in *-*) echo prerelease ;; "$highest") echo latest ;; *) echo older ;; esac > "$RUNNER_TEMP/channel"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
          path: ${{ runner.temp }}/release

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/release/dist/*

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          flags=(--verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/release/notes.md")
          case "$(cat "$RUNNER_TEMP/channel")" in
            prerelease) flags+=(--prerelease --latest=false) ;;
            latest) flags+=(--latest) ;;
            *) flags+=(--latest=false) ;;
          esac
          gh release create "$TAG" "${flags[@]}" "$RUNNER_TEMP"/release/dist/*
