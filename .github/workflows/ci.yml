# Runs the targets of `make ci` (ci/README.md) as parallel jobs sharing one toolbox image build, then the report as the job summary.
# The last job `ci` is the one required check: it fails if any target failed.
name: ci
on:
  push:
    branches: ['**']
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
# Action SHAs are release tags named in the comments, published 2026-07-20 or earlier, looked up on GitHub.
jobs:
  toolbox:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make toolbox
      - run: docker save orbit-ci-toolbox:dev | gzip -1 > "$RUNNER_TEMP/toolbox.tar.gz"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 (2026-04-10)
        with:
          name: toolbox
          path: ${{ runner.temp }}/toolbox.tar.gz
          retention-days: 1
  checks:
    needs: toolbox
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: [vet, quality, security, sast]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans the whole history
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: toolbox
          path: ${{ runner.temp }}
      - run: gunzip -c "$RUNNER_TEMP/toolbox.tar.gz" | docker load
      - run: mkdir -p ci/out && make ${{ matrix.target }}
        env:
          SKIP_TOOLBOX_BUILD: '1'
      - name: Upload the check records and logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 (2026-04-10)
        with:
          name: ci-report-${{ matrix.target }}
          path: ci/out/
          retention-days: 7
          if-no-files-found: ignore
  ci:
    needs: [toolbox, checks]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: toolbox
          path: ${{ runner.temp }}
        continue-on-error: true
      - run: gunzip -c "$RUNNER_TEMP/toolbox.tar.gz" | docker load
        continue-on-error: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ci-report-*
          path: ci/out
          merge-multiple: true
        continue-on-error: true
      - name: Job summary
        run: SKIP_TOOLBOX_BUILD=1 make -s report >> "$GITHUB_STEP_SUMMARY"
        continue-on-error: true
      - name: Result
        env:
          RESULT: ${{ needs.toolbox.result }} ${{ needs.checks.result }}
        run: '[ "$RESULT" = "success success" ] || { echo "ci: FAIL ($RESULT)"; exit 1; }; echo "ci: PASS"'
